<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="ORBIT Security Model: Score = Coverage × Maturity × Validation">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A6FF"/>
      <stop offset="55%" stop-color="#A268F8"/>
      <stop offset="100%" stop-color="#A268F8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0%" stop-color="#5E3F96"/>
      <stop offset="100%" stop-color="#A268F8"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1C1C28" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:Consolas,'JetBrains Mono','Fira Code',Menlo,monospace}
      .lbl{fill:#8B8BA3;font-size:11px;letter-spacing:2px}
      .ttl{fill:#FFFFFF;font-size:22px;font-weight:700;letter-spacing:3px}
      .eq{fill:#E6E6F0;font-size:17px}
      .acc{fill:#A268F8}
      .term{fill:#C9C9D6;font-size:13px}
      .dim{fill:#5E5E78;font-size:12px}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .grow1{animation:g 2.4s ease-out both}
      .grow2{animation:g 2.4s .3s ease-out both}
      .grow3{animation:g 2.4s .6s ease-out both}
      @keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .pulse{animation:p 3s ease-in-out infinite;transform-origin:170px 150px}
      @keyframes p{50%{transform:scale(1.12);opacity:.75}}
    </style>
  </defs>

  <!-- frame -->
  <rect x="1" y="1" width="878" height="298" rx="14" fill="#0E0E14" stroke="#2A2A3A" stroke-width="1.5"/>
  <rect x="1" y="1" width="878" height="298" rx="14" fill="url(#grid)" opacity=".6"/>
  <rect x="1" y="1" width="878" height="30" rx="14" fill="#14141D"/>
  <rect x="1" y="20" width="878" height="11" fill="#14141D"/>
  <circle cx="22" cy="16" r="5" fill="#3A3A4E"/><circle cx="40" cy="16" r="5" fill="#3A3A4E"/><circle cx="58" cy="16" r="5" fill="#A268F8"/>
  <text x="440" y="20" text-anchor="middle" class="mono dim">orbit://security-model — RISK // CONTEXT // DECISION</text>

  <!-- orbit system -->
  <g transform="translate(0,8)">
    <ellipse cx="170" cy="150" rx="128" ry="50" fill="none" stroke="#2E2442" stroke-width="1.2" transform="rotate(-18 170 150)"/>
    <ellipse cx="170" cy="150" rx="128" ry="50" fill="none" stroke="#2E2442" stroke-width="1.2" transform="rotate(42 170 150)"/>
    <ellipse cx="170" cy="150" rx="128" ry="50" fill="none" stroke="#2E2442" stroke-width="1.2" transform="rotate(102 170 150)"/>

    <circle cx="170" cy="150" r="46" fill="url(#core)" class="pulse" opacity=".55"/>
    <circle cx="170" cy="150" r="30" fill="#14141D" stroke="#A268F8" stroke-width="1.5"/>
    <text x="170" y="155" text-anchor="middle" class="mono" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="2">ORBIT</text>

    <!-- satellites -->
    <g transform="rotate(-18 170 150)">
      <circle cx="298" cy="150" r="6" fill="#A268F8"><animateMotion dur="9s" repeatCount="indefinite" path="M0,0 A128,50 0 1,1 -256,0 A128,50 0 1,1 0,0"/></circle>
    </g>
    <g transform="rotate(42 170 150)">
      <circle cx="42" cy="150" r="5" fill="#C9A6FF"><animateMotion dur="12s" repeatCount="indefinite" path="M0,0 A128,50 0 1,1 256,0 A128,50 0 1,1 0,0"/></circle>
    </g>
    <g transform="rotate(102 170 150)">
      <circle cx="298" cy="150" r="4.5" fill="#FFFFFF"><animateMotion dur="15s" repeatCount="indefinite" path="M0,0 A128,50 0 1,0 -256,0 A128,50 0 1,0 0,0"/></circle>
    </g>
  </g>

  <!-- right panel -->
  <text x="352" y="68" class="mono lbl">PROPRIETARY METHODOLOGY · A. COSSA JR.</text>
  <text x="352" y="96" class="mono ttl">ORBIT SECURITY MODEL</text>
  <text x="352" y="128" class="mono eq"><tspan class="acc">Score</tspan> = Coverage <tspan class="acc">×</tspan> Maturity <tspan class="acc">×</tspan> Validation</text>

  <g class="mono term">
    <text x="352" y="168">COVERAGE</text>
    <rect x="462" y="158" width="250" height="10" rx="5" fill="#1C1C28"/>
    <rect x="462" y="158" width="215" height="10" rx="5" fill="url(#bar)" class="grow1" style="transform-origin:462px 163px"/>
    <text x="722" y="168" class="dim">breadth of control</text>

    <text x="352" y="196">MATURITY</text>
    <rect x="462" y="186" width="250" height="10" rx="5" fill="#1C1C28"/>
    <rect x="462" y="186" width="180" height="10" rx="5" fill="url(#bar)" class="grow2" style="transform-origin:462px 191px"/>
    <text x="722" y="196" class="dim">depth of capability</text>

    <text x="352" y="224">VALIDATION</text>
    <rect x="462" y="214" width="250" height="10" rx="5" fill="#1C1C28"/>
    <rect x="462" y="214" width="235" height="10" rx="5" fill="url(#bar)" class="grow3" style="transform-origin:462px 219px"/>
    <text x="722" y="224" class="dim">evidence it works</text>
  </g>

  <text x="352" y="264" class="mono term"><tspan class="acc">aizen@orbit</tspan>:~$ a gap in any term zeroes the score<tspan class="acc blink"> ▌</tspan></text>
</svg>
